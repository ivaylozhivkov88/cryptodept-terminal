<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="CryptoDept Terminal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="1" stop-color="#0a1a0a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00FF41" stroke-opacity="0.07"/>
    </pattern>
    <style>
      .mono{font-family:'Consolas','Courier New',monospace}
      .cur{animation:b 1s steps(2) infinite}
      @keyframes b{50%{opacity:0}}
      .scan{animation:s 6s linear infinite}
      @keyframes s{from{transform:translateY(-40px)}to{transform:translateY(400px)}}
    </style>
  </defs>
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <rect class="scan" width="1200" height="40" fill="#00FF41" opacity="0.05"/>
  <rect x="0.5" y="0.5" width="1199" height="359" fill="none" stroke="#FFB000" stroke-opacity="0.5"/>
  <text x="60" y="70" class="mono" font-size="18" fill="#00FF41" opacity="0.8">root@cryptodept:~# ./launch --mode=tactical</text>
  <text x="60" y="170" class="mono" font-size="76" font-weight="700" fill="#FFB000">CRYPTODEPT</text>
  <text x="60" y="225" class="mono" font-size="30" fill="#00FF41" letter-spacing="6">TERMINAL // TACTICAL AI INTELLIGENCE</text>
  <text x="60" y="290" class="mono" font-size="20" fill="#808080">Multi-agent crypto analysis  ·  Quant Lab  ·  Live widgets</text>
  <rect class="cur" x="60" y="305" width="14" height="22" fill="#00FF41"/>
  <text x="1140" y="330" class="mono" font-size="16" fill="#FFB000" text-anchor="end" opacity="0.7">ANDROID · KOTLIN · COMPOSE</text>
</svg>
